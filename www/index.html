function demo(){S=fresh();S.demo=1;const n=Date.now();let km=35000,lf=km;S.start=n-11*D;

const m=S.maint;[[0,420,20,1000,0,35],[1,1850,90,2000,0,120],[4,3200,150,3000,0,40],[6,100,5,0,60,25]].forEach(([i,a,d,ik,id,c])=>{m[i].lastKm=km-a;m[i].lastDate=n-d*D;m[i].intKm=ik||null;m[i].intDays=id||null;m[i].cost=c});save()}

function bars(a,fm,key="v"){if(!a.length)return"<p class=mu>Sem dados no período.</p>";const mx=Math.max(...a.map(x=>x[key]))||1,w=300/a.length;return`<svg viewBox="0 0 300 96" class=ch>`+a.map((x,i)=>{const h=x[key]/mx*56;return`<rect x="${i*w+w*.15}" y="${76-h}" width="${w*.7}" height="${h}" rx=2 fill="#d71920"/><text x="${i*w+w/2}" y="88" font-size="7" text-anchor=middle fill="currentColor" opacity=.6>${x.l}</text><text x="${i*w+w/2}" y="${72-h}" font-size="6" text-anchor=middle fill="currentColor">${fm(x[key])}</text>`}).join("")+"</svg>"}
function dser(f){const m={},a=(t,k,v)=>{const d=dk(t);(m[d]=m[d]||{r:0,c:0})[k]+=v};S.shifts.filter(s=>s.end&&f(s.end)).forEach(s=>a(s.start,"r",rev(s)));S.fuels.filter(x=>f(x.ts)).forEach(x=>a(x.ts,"c",x.total));S.log.filter(x=>f(x.ts)).forEach(x=>a(x.ts,"c",x.cost));S.exp.filter(x=>f(x.ts)).forEach(x=>a(x.ts,"c",x.val));return Object.keys(m).sort().slice(-12).map(d=>({l:d.slice(8)+"/"+d.slice(5,7),...m[d]}))}
const prog=(l,v,g)=>g>0?`<div class=card><small>${l}: ${R(v)} de ${R(g)} (${N(v/g*100,0)}%)</small><div class=bar><i style="width:${Math.min(100,v/g*100)}%"></i></div></div>`:"";
const DIAL=(()=>{const P=(v,r)=>{const a=(135+v*2.7)*Math.PI/180;return[150+r*Math.cos(a),150+r*Math.sin(a)]};let s=`<svg viewBox="0 0 300 300"><defs><linearGradient id="cr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f5f5"/><stop offset=".35" stop-color="#8a8a8a"/><stop offset=".6" stop-color="#e9e9e9"/><stop offset="1" stop-color="#6d6d6d"/></linearGradient></defs><circle cx=150 cy=150 r=148 fill="url(#cr)"/><circle cx=150 cy=150 r=138 fill="#2b2b2b"/><circle cx=150 cy=150 r=133 fill="#050505"/>`;for(let v=0;v<=100;v+=5){const M=v%10==0,[x1,y1]=P(v,M?114:120),[x2,y2]=P(v,128);s+=`<line x1=${x1} y1=${y1} x2=${x2} y2=${y2} stroke="#eee" stroke-width=${M?2.4:1.2}/>`;if(M){const[x,y]=P(v,96);s+=`<text x=${x} y=${y+4} fill="#f2f2f2" font-size=12 font-weight=700 text-anchor=middle font-family=Arial>${v}</text>`}}
s+=`<text x=150 y=128 fill="#bbb" font-size=8 text-anchor=middle>km/h</text><text x=150 y=172 fill="#eee" font-size=13 font-weight=800 text-anchor=middle font-family=Arial letter-spacing=2>HONDA</text><text x=150 y=186 fill="#d71920" font-size=8 text-anchor=middle font-weight=700>POP 100</text>
<text x=112 y=82 fill="#22c55e" font-size=15 opacity=.35>◀</text><text x=176 y=82 fill="#22c55e" font-size=15 opacity=.35>▶</text><circle cx=150 cy=72 r=9 fill="none" stroke="#3b82f6" stroke-width=2 opacity=.35 /><text x=150 y=76 fill="#3b82f6" font-size=10 font-weight=700 text-anchor=middle opacity=.35>D</text><text x=150 y=108 fill="#22c55e" font-size=11 font-weight=800 text-anchor=middle opacity=.35>N</text>`;const[nx,ny]=P(0,104);return s+`<polygon points="${150-3},${150-3} ${nx},${ny} ${150+3},${150+3}" fill="#e11"/><line x1=150 y1=150 x2=${nx} y2=${ny} stroke="#e11" stroke-width=3 stroke-linecap=round /><circle cx=150 cy=150 r=9 fill="#333" stroke="#999"/></svg>`})();
function odo(km){const s=String(Math.round(km)).padStart(6,"0").slice(-6),p=String(Math.round(shown)).padStart(6,"0").slice(-6);return`<div class=odo>`+[...s].map((d,i)=>`<i><b data-d=${d} style="transform:translateY(-${p[i]}em)">${"0123456789".split("").join("<br>")}</b></i>`).join("")+"</div>"}
const row=(a,b,c,x="")=>`<div class=card>${x}<b>${a}</b><br><small>${b}</small><div>${c}</div></div>`;
const V=[()=>{const s=open(),c=lastKm(),t=dk(Date.now()),kmH=sum(deltas().filter(x=>dk(x.ts)==t).map(x=>x.d)),sh=S.shifts.filter(x=>x.end&&dk(x.start)==t),cs=cons(),f0=S.odo.length?S.odo[0].ts:S.start,dd=Math.floor((Date.now()-f0)/D)+1,dw=new Set(S.shifts.map(x=>dk(x.start))).size;
return(S.demo?`<div class=card><b>Dados de demonstração</b><p class=mu>Remova antes de começar a usar.</p><button class=b2 onclick=clr()>Limpar e começar</button></div>`:"")+`<div class=dial>${DIAL}${odo(c)}</div>`+(s?`<div class="card ban">🔴 Jornada aberta desde ${fd(s.start)} · <b id=tm>${hm(wm(s))}</b></div>`:"")+`<button class=b1 onclick=rkm()>REGISTRAR KM</button><div class=g>${k("Km atual",N(c,0))}${k("Dia / trabalhados",dd+" / "+dw)}${k("Km hoje",N(kmH,0))}${k("Bruto hoje",R(sum(sh.map(rev))))}${k("Lucro est. hoje",R(sum(sh.map(x=>sm(x).l))))}${k("Consumo médio",cs.kmpl?N(cs.kmpl)+" km/L":"sem dados")}</div><button class=b2 onclick=fix()>Corrigir / trocar painel</button>`},
()=>{const s=open();let h="";if(s){const p=s.pauses.find(x=>!x.e);h=`<div class="card ban">🔴 Em andamento desde ${fd(s.start)}<br>Km inicial ${N(s.startKm,0)}<br>Tempo trabalhado <b id=tm>${hm(wm(s))}</b>${p?" · EM PAUSA":""}</div><button class=b2 onclick=pz()>${p?"▶ RETOMAR":"⏸ PAUSAR"}</button><button class=b1 onclick=endD()>ENCERRAR O DIA</button>`}else h=`<button class=b1 onclick=startD()>COMEÇAR O DIA</button>`;
return h+"<h3>Jornadas</h3>"+(S.shifts.filter(x=>x.end).reverse().slice(0,30).map(x=>{const m=sm(x);return row(fd(x.start),`${N(m.km,0)} km · ${hm(m.h)} · despesas ${R(m.x)}`,`Bruto <b>${R(m.b)}</b> · Lucro est. <b>${R(m.l)}</b><br><small>${R(m.rk)}/km · ${R(m.rh)}/h · lucro ${R(m.lk)}/km</small><br><button class="x" style="float:none;margin-top:6px" onclick="editS('${x.id}')">Completar valores</button>`,del("shifts",x.id))}).join("")||"<p class=mu>Nenhuma jornada encerrada.</p>")},
()=>{const t=dk(Date.now()),f=S.fuels,sp=g=>sum(f.filter(x=>g(x.ts)).map(x=>x.total)),c=cons(),l=[...f].reverse()[0];
return`<button class=b1 onclick=fuelF()>ABASTECER</button><div class=g>${k("Preço/L (último)",l?R(l.total/l.liters):"—")}${k("Litros (total)",N(sum(f.map(x=>x.liters)),2)+" L")}${k("Gasto hoje",R(sp(d=>dk(d)==t)))}${k("Gasto 7 dias",R(sp(d=>d>Date.now()-7*D)))}${k("Gasto no mês",R(sp(d=>dk(d).slice(0,7)==t.slice(0,7))))}${k("Consumo médio",c.kmpl?N(c.kmpl)+" km/L":"sem dados")}${k("Custo/km combustível",c.cpk?R(c.cpk):"sem dados")}</div>${c.kmpl?"":"<p class=mu>Consumo real exige dois abastecimentos de tanque cheio.</p>"}<h3>Histórico</h3>`+([...f].reverse().map(x=>row(fd(x.ts),`Km ${N(x.km,0)} · ${x.type}${x.full?" · tanque cheio":""}`,`${R(x.total)} · ${N(x.liters,2)} L · ${R(x.total/x.liters)}/L`,del("fuels",x.id))).join("")||"<p class=mu>Sem abastecimentos.</p>")},
()=>`<button class=b1 onclick="mf('new')">+ NOVO ITEM</button>`+S.maint.map(m=>{const s=ms(m);return`<div class=card><span class="pill ${s.c}"></span><b>${m.name}</b><br><small>${s.t}${m.lastKm!=null?`<br>Última: ${N(m.lastKm,0)} km`:""}${m.lastDate?" · "+new Date(m.lastDate).toLocaleDateString("pt-BR"):""}${m.cost?" · "+R(m.cost):""}${m.notes?"<br>"+m.notes:""}</small><div class=row><button class=b2 onclick="mf('${m.id}')">Editar</button><button class=b1 style="font-size:14px" onclick="mdone('${m.id}')">FEITO AGORA</button></div></div>`}).join("")+`<small>Verde: em dia · Amarelo: ≤ ${N(S.set.warn,0)} km ou 7 dias · Vermelho: vencida. Intervalos são seus, não recomendação da Honda.</small>`,
()=>{const f=rg(),s=st(f),t=dk(Date.now()),c=cons(),sd=dser(f),tb=(i,l)=>`<button class="${RG==i?"on":""}" onclick="RG='${i}';render()">${l}</button>`,H=evs().filter(e=>(!hT||e.t==hT)&&(!hf||dk(e.ts)>=hf)&&(!ht||dk(e.ts)<=ht)).slice(0,60);
return`<div class=tabs>${tb("hoje","Hoje")+tb("7","7 dias")+tb("mes","Mês")+tb("c","Período")+tb("all","Tudo")}</div>`+(RG=="c"?`<div class=row><input type=date value="${cf}" onchange="cf=this.value;render()"><input type=date value="${ct}" onchange="ct=this.value;render()"></div>`:"")+prog("Meta diária",st(d=>dk(d)==t).r,S.set.gd)+prog("Meta mensal",st(d=>dk(d).slice(0,7)==t.slice(0,7)).r,S.set.gm)+`<div class=g>${k("Faturamento",R(s.r))}${k("Combustível",R(s.fu))}${k("Manutenção",R(s.mt))}${k("Outros custos",R(s.ot))}${k("Lucro estimado",R(s.l))}${k("Km rodados",N(s.km,0))}${k("Média/dia trab.",R(s.dw?s.r/s.dw:0))}${k("Receita/km",R(s.km?s.r/s.km:0))}${k("Custo/km",R(s.km?s.c/s.km:0))}${k("Consumo",c.kmpl?N(c.kmpl)+" km/L":"sem dados")}${k("Dias trabalhados",s.dw)}${k("Provisão manut.*",R(s.pv))}</div><small>*Estimativa informativa; não entra no lucro, que usa só custos efetivamente pagos.</small><h3>Faturamento por dia</h3>${bars(sd,v=>N(v,0),"r")}<h3>Despesas por dia</h3>${bars(sd,v=>N(v,0),"c")}<h3>Consumo (km/L)</h3>${bars(c.ser.slice(-12),v=>N(v),"v")}<h3>Histórico</h3><div class=row><select onchange="hT=this.value;render()"><option value="">Todos</option>${[["jornada","Jornadas"],["abast","Abastecimentos"],["manut","Manutenções"],["km","Km"],["fin","Despesas"]].map(a=>`<option value=${a[0]}${hT==a[0]?" selected":""}>${a[1]}</option>`).join("")}</select><input type=date value="${hf}" onchange="hf=this.value;render()"><input type=date value="${ht}" onchange="ht=this.value;render()"></div>`+H.map(e=>`<div class=ev><span><small>${fd(e.ts)}</small><br>${e.x}</span><span>${e.v!=null?R(e.v):""}${e.c?del(e.c,e.id):""}</span></div>`).join("")+`<h3>Dados</h3><button class=b2 onclick=cfg()>Metas e alertas</button><button class=b2 onclick=csv()>Exportar CSV</button><button class=b2 onclick=rep()>Relatório do mês (abrir e imprimir como PDF)</button><button class=b2 onclick=bk()>Backup (JSON)</button><label class=b2 style="padding:16px;text-align:center;border-radius:14px;color:var(--fg);font-weight:700">Restaurar backup<input type=file accept=".json" style="display:none" onchange="rs(this)"></label>`+(S.demo?`<button class=b2 onclick=clr()>Limpar dados de demonstração</button>`:"")}];
const NV=[["🏍️","Painel"],["⏱️","Jornada"],["⛽","Abastecer"],["🔧","Manutenção"],["📊","Relatórios"]];
function render(){save();$("#v").innerHTML=V[tab]();$("#nv").innerHTML=NV.map((n,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};render();scrollTo(0,0)"><span>${n[0]}</span>${n[1]}</button>`).join("");if(tab==0){const c=lastKm();setTimeout(()=>{document.querySelectorAll(".odo b").forEach(b=>b.style.transform=`translateY(-${b.dataset.d}em)`);shown=c},40)}}
setInterval(()=>{const e=$("#tm"),s=open();if(e&&s)e.textContent=hm(wm(s))},15000);
render();
</script></body></html>
